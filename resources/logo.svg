<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Quran Quizz: the eight-pointed star that marks the quarters of a hizb, with the word
       "Al-Qur'an" at its heart. Source of every icon and splash screen: see scripts/app-icons.sh. -->
  <defs>
    <radialGradient id="emerald" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#17a085"/>
      <stop offset=".5" stop-color="#0f7a64"/>
      <stop offset="1" stop-color="#0a4f41"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="512" y1="144" x2="512" y2="880">
      <stop offset="0" stop-color="#f3d993"/>
      <stop offset=".5" stop-color="#d4a947"/>
      <stop offset="1" stop-color="#b08530"/>
    </linearGradient>
    <radialGradient id="heart" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#128a71"/>
      <stop offset="1" stop-color="#0a5a49"/>
    </radialGradient>
    <clipPath id="star">
      <rect x="252" y="252" width="520" height="520" rx="28"/>
      <rect x="252" y="252" width="520" height="520" rx="28" transform="rotate(45 512 512)"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04261f" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect id="background" width="1024" height="1024" fill="url(#emerald)"/>

  <g id="mark">
